baseURL = "https://ruanrui.com.cn"
theme = "LoveIt"
title = "阮睿的个人主页"
languageCode = "zh-CN"
languageName = "简体中文"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

[cascade]
  type = "about"
  [cascade._target]
    path = "{/about,/about/**}"

[taxonomies]
  tag = "tags"
  category = "categories"
  research_topics = "research_topics"
  courses = "courses"

[params]
  images = ["/og.png"]
  description = "阮睿，中央财经大学长聘副教授、博士生导师，研究宏观政策沟通、企业预期、财政治理与政府企业行为。"

  [params.cdn]
    data = ""

  [params.header.title]
    name = "阮睿"

  [params.app]
    title = "阮睿"

  [params.assets]
    disableFingerprinting = true

  # 作者配置（修改为params.author避免deprecation warning）
  [params.author]
    name = "阮睿"
    email = "ruanrui@cufe.edu.cn"
    link = "https://ruanrui.com.cn"

  # 主页配置
  [params.home]
    rss = 10
    [params.home.profile]
      enable = true
      gravatarEmail = ""
      avatarURL = "/images/rr2.jpg"
      title = "阮睿"
      subtitle = "长聘副教授，博士生导师"
      subtitle2 = "中央财经大学中国财政发展协同创新中心"
      typeit = false
      social = true
      disclaimer = ""
    
    [params.home.posts]
      enable = true
      paginate = 60
      defaultHiddenFromHomePage = false

  # 数学公式支持
  [params.page.math]
    enable = true
    blockLeftDelimiter = "$$"
    blockRightDelimiter = "$$"
    inlineLeftDelimiter = "$"
    inlineRightDelimiter = "$"

# 菜单配置
[menu]
  [[menu.main]]
    weight = 1
    identifier = "about"
    name = "简历"
    url = "/about/"
  [[menu.main]]
    weight = 2
    identifier = "research_topics"
    name = "研究"
    url = "/research_topics/"
  [[menu.main]]
    weight = 3
    identifier = "courses"
    name = "教学"
    url = "/courses/"
  [[menu.main]]
    weight = 4
    identifier = "media"
    name = "媒体"
    url = "/categories/媒体/"


# Hugo 解析文档的配置
[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true
